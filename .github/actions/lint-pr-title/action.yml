########################################################################################
# "lint-pr-title" composite action                                                     #
#--------------------------------------------------------------------------------------#
# Validates pull request titles using your commitlint configuration.                    #
#                                                                                      #
# Usage in workflow steps (from ci-lint-pr-title-action.yml):                          #
#                                                                                      #
#      - name: ✅ Valid PR title passes                                                #
#        uses: ./.github/actions/lint-pr-title                                         #
#        with:                                                                         #
#          title: "feat: validate PR title with commitlint"                            #
#                                                                                      #
########################################################################################

name: "Lint PR Title"
description: "Validates PR title using commitlint config"

inputs:
  title:
    description: "The PR title to validate"
    required: true
  commitlint-config:
    description: "Path to commitlint configuration file"
    required: false
    default: "commitlint.config.js"
  error-message:
    description: "Error message shown when the PR title does not pass commitlint"
    required: false
    default: "PR title must follow commitlint rules"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "lts/*"

    - name: Lint PR title
      shell: bash
      env:
        PR_TITLE: ${{ inputs.title }}
        COMMITLINT_CONFIG: ${{ inputs.commitlint-config }}
        ERROR_MESSAGE: ${{ inputs.error-message }}
      run: bash "${{ github.action_path }}/lint-pr-title.sh"
