########################################################################################
# "upsert-pr-comment" composite action                                                 #
#--------------------------------------------------------------------------------------#
# Creates or updates a PR comment identified by a hidden marker comment.               #
#                                                                                      #
# Usage in workflow steps (from ci-pr-living-kavita-loca.yml):                         #
#                                                                                      #
#      - name: 💬 Comment PR with preview URL                                          #
#        uses: ./.github/actions/upsert-pr-comment                                     #
#        with:                                                                         #
#          identifier: "<!-- living-kavita-loca-preview-url -->"                       #
#          body: |                                                                     #
#            ## 🎉 Preview Deployed!                                                   #
#            **🔗 ${{ needs.run-living-kavita-loca-unit-tests-and-preview.outputs.preview_url }}**
#                                                                                      #
# Note: This action intentionally checks only the first page of PR comments. Keep bot  #
# comments on a PR limited to avoid duplicate comment creation when older bot comments  #
# move beyond the first page.                                                          #
#                                                                                      #
########################################################################################

name: "Upsert PR Comment"
description: >
  Create or update a comment on a pull request. Uses a hidden HTML identifier
  to find an existing comment so it can be updated in-place instead of posting
  duplicates. Note: this action intentionally scans only the first page of PR
  comments (no pagination).

inputs:
  identifier:
    description: >
      A unique string used to locate an existing comment (e.g. "<!-- my-bot-comment -->").
      This is prepended to the body automatically.
    required: true
  body:
    description: "Markdown body of the comment (identifier is prepended automatically)"
    required: true
  github-token:
    description: "GitHub token with pull-requests: write permission"
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    # actions/github-script evaluates the `script` input as JavaScript in a
    # Node.js runtime, injecting github (Octokit), context, and core helpers.
    # The external file is loaded via require(), so it must be CommonJS
    # (module.exports), not ESM (export default).
    - name: Upsert PR comment
      uses: actions/github-script@v7
      env:
        IDENTIFIER: ${{ inputs.identifier }}
        COMMENT_BODY: ${{ inputs.body }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const path = require('path');
          const script = require(path.join(process.env.GITHUB_ACTION_PATH, 'upsert.js'));
          await script({ github, context, core });
