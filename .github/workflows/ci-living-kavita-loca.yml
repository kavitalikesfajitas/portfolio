name: "Living Kavita Loca App Tests, Build, Lint and Check Size - Reusable Workflow"

on:
  workflow_call:
    inputs:
      deploy_to:
        description: "Deployment target: production, preview, or none"
        required: false
        type: string
        default: "none"
      pr_number:
        description: "PR number for preview deployments"
        required: false
        type: string
        default: ""
    outputs:
      preview_url:
        description: "Preview URL for PR deployments"
        value: ${{ jobs.build-app-and-run-tests.outputs.preview_url }}

jobs:
  build-app-and-run-tests:
    environment: default
    name: "Living Kavita Loca App Tests, Build, Lint and Check Size"
    runs-on: [ubuntu-latest]
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    permissions:
      id-token: write
      contents: read
    outputs:
      preview_url: ${{ steps.set-preview-url.outputs.url }}
    defaults:
      run:
        working-directory: apps/living-kavita-loca

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: 📥 Monorepo install
        uses: ./.github/actions/yarn-monorepo-install
        with:
          node-version-file: ".nvmrc"

      - name: ♻️ Restore living-kavita-loca related caches
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/apps/living-kavita-loca/.next/cache
            ${{ github.workspace }}/.cache
            ${{ github.workspace }}/**/tsconfig.tsbuildinfo
          key: living-kavita-loca-cache-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: 📝 Generate Next.js types
        run: yarn next typegen

      - name: 🕵️ Typecheck
        run: yarn --top-level run turbo typecheck

      - name: 🔬 Linter
        run: yarn --top-level run turbo lint
        env:
          TIMING: 1

      - name: 🧪 Unit tests
        run: yarn --top-level run turbo test-ci

      - name: 🏗 Build living-kavita-loca
        run: yarn --top-level run turbo build
        env:
          NEXT_TELEMETRY_DISABLED: true
          ENABLE_CACHE: true
          PR_NUMBER: ${{ inputs.pr_number }}

      - name: ✅ Validate preview inputs
        if: inputs.deploy_to == 'preview'
        run: |
          if [ -z "${{ inputs.pr_number }}" ]; then
            echo "::error::pr_number is required for preview deployments"
            exit 1
          fi

      - name: Configure AWS Credentials
        if: inputs.deploy_to != 'none'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: 🚀 Deploy to S3 (Production)
        if: inputs.deploy_to == 'production'
        run: aws s3 sync out s3://${{ vars.S3_BUCKET_NAME }} --delete

      - name: 🚀 Deploy to S3 (PR Preview)
        if: inputs.deploy_to == 'preview'
        run: |
          aws s3 sync out s3://${{ vars.PR_PREVIEW_BUCKET_NAME }}/pr-${{ inputs.pr_number }}/ --delete

      - name: 🔄 Invalidate CloudFront cache
        if: inputs.deploy_to == 'production'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/" "/work/*" "/main/*"

      - name: 📝 Set preview URL output
        id: set-preview-url
        if: inputs.deploy_to == 'preview'
        run: |
          echo "url=http://${{ vars.PR_PREVIEW_BUCKET_NAME }}.s3-website-${{ vars.AWS_REGION }}.amazonaws.com/pr-${{ inputs.pr_number }}/" >> $GITHUB_OUTPUT
