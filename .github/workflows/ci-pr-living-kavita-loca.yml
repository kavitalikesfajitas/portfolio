name: "Living Kavita Loca - CI Living Kavita Loca App Pull Request"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "apps/living-kavita-loca/**"
      - "packages/**"
      - "package.json"
      - "*.lock"
      - ".yarnrc.yml"
      - "tsconfig.base.json"
      - ".prettier*"
      - ".github/**"
      - "!.github/workflows/ci-pr-audit.yml"
      - "!.github/workflows/ci-pr-body-audit-reusable.yml"
      - "!.github/workflows/ci-pr-reusable-commit-lint.yml"

# This is a concurrency key to prevent multiple runs of this workflow from running at the same time on a pr
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  detect-changes:
    if: github.ref != 'refs/heads/main' && github.event.pull_request.draft == false
    name: "Determine if we need to deploy a preview PR or not"
    runs-on: ubuntu-latest
    outputs:
      app_or_packages_changed: ${{ steps.filter.outputs.matches }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 🔍 Detect changes in app or packages
        id: filter
        uses: ./.github/actions/match-changed-paths
        with:
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.sha }}
          paths: |
            apps
            packages
            tsconfig.base.json

  run-living-kavita-loca-unit-tests-and-preview:
    needs: detect-changes
    uses: ./.github/workflows/ci-living-kavita-loca.yml
    name: "Living Kavita Loca App Tests and Preview"
    with:
      deploy_to: ${{ needs.detect-changes.outputs.app_or_packages_changed == 'true' && 'preview' || 'none' }}
      pr_number: ${{ github.event.pull_request.number }}
    secrets: inherit

  comment-preview-url:
    name: "Comment PR with Preview URL"
    needs: [detect-changes, run-living-kavita-loca-unit-tests-and-preview]
    if: needs.detect-changes.outputs.app_or_packages_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 💬 Comment PR with preview URL
        uses: ./.github/actions/upsert-pr-comment
        with:
          identifier: "<!-- living-kavita-loca-preview-url -->"
          body: |
            ## 🎉 Preview Deployed!

            Your preview is ready at:

            **🔗 ${{ needs.run-living-kavita-loca-unit-tests-and-preview.outputs.preview_url }}**
