name: "Living Kavita Loca - CI Living Kavita Loca App Pull Request"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "apps/living-kavita-loca/**"
      - "packages/**"
      - "package.json"
      - "*.lock"
      - ".yarnrc.yml"
      - "tsconfig.base.json"
      - ".prettier*"
      - ".github/**"
      - "!.github/workflows/ci-pr-audit.yml"
      - "!.github/workflows/ci-pr-body-audit-reusable.yml"
      - "!.github/workflows/ci-pr-reusable-commit-lint.yml"

# This is a concurrency key to prevent multiple runs of this workflow from running at the same time on a pr
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  run-living-kavita-loca-unit-tests-and-preview:
    if: github.ref != 'refs/heads/main' && github.event.pull_request.draft == false
    uses: ./.github/workflows/ci-living-kavita-loca.yml
    name: "Living Kavita Loca App Tests and Preview"
    with:
      deploy_to: preview
      pr_number: ${{ github.event.pull_request.number }}
    secrets: inherit

  comment-preview-url:
    name: "Comment PR with Preview URL"
    needs: run-living-kavita-loca-unit-tests-and-preview
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: 💬 Comment PR with preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const previewUrl = '${{ needs.run-living-kavita-loca-unit-tests-and-preview.outputs.preview_url }}';

            const comment = `## 🎉 Preview Deployed!

            Your preview is ready at:

            **🔗 ${previewUrl}**
            `;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Preview Deployed')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: comment
              });
            }
