name: "PR Preview Cleanup"

on:
  pull_request:
    types: [closed]

permissions:
  id-token: write
  contents: read

jobs:
  cleanup-preview:
    environment: default
    name: "Cleanup PR Preview"
    runs-on: [ubuntu-latest]

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: 🗑️ Delete PR preview from S3
        run: |
          aws s3 rm s3://${{ vars.PR_PREVIEW_BUCKET_NAME }}/pr-${{ github.event.pull_request.number }}/ --recursive
