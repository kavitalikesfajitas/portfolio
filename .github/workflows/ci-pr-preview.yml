name: "PR Preview Deployment"

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "apps/living-kavita-loca/**"
      - "packages/**"
      - ".github/workflows/ci-pr-preview.yml"
      - "package.json"
      - "*.lock"
      - ".yarnrc.yml"

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  deploy-preview:
    name: "Build and Deploy PR Preview"
    uses: ./.github/workflows/ci-living-kavita-loca.yml
    with:
      deploy_to: preview
      pr_number: ${{ github.event.pull_request.number }}
    secrets: inherit

  comment-preview-url:
    name: "Comment PR with Preview URL"
    needs: deploy-preview
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: 💬 Comment PR with preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const previewUrl = '${{ needs.deploy-preview.outputs.preview_url }}';

            const comment = `## 🎉 Preview Deployed!

            Your preview is ready at:

            **🔗 ${previewUrl}**

            ### Pages to check:
            - [Home](${previewUrl})
            - [Work: OpenSea Swoosh ID](${previewUrl}work/opensea-swoosh-id/)
            - [Work: Contentful GraphQL Proxy](${previewUrl}work/contentful-graphql-proxy/)
            `;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Preview Deployed')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: comment
              });
            }
