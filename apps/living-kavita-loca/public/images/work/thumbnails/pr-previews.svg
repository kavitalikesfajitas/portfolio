<svg width="1200" height="630" viewBox="0 0 1200 630" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0A0E27"/>
  
  <!-- Title -->
  <text x="600" y="80" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle">
    PR Deploy Previews
  </text>
  <text x="600" y="120" font-family="Arial, sans-serif" font-size="22" fill="#8892b0" text-anchor="middle">
    Auto-deploy every PR for ~$0.50/month
  </text>
  
  <!-- Flow Boxes -->
  <!-- GitHub PR -->
  <rect x="100" y="200" width="180" height="100" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="190" y="240" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#58a6ff" text-anchor="middle">GitHub PR</text>
  <text x="190" y="270" font-family="Arial, sans-serif" font-size="16" fill="#8892b0" text-anchor="middle">#123</text>
  
  <!-- Arrow 1 -->
  <line x1="280" y1="250" x2="340" y2="250" stroke="#64ffda" stroke-width="3"/>
  <polygon points="340,250 330,245 330,255" fill="#64ffda"/>
  
  <!-- GitHub Actions -->
  <rect x="350" y="200" width="180" height="100" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="440" y="235" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#64ffda" text-anchor="middle">Actions</text>
  <text x="440" y="260" font-family="Arial, sans-serif" font-size="14" fill="#8892b0" text-anchor="middle">Test → Build</text>
  <text x="440" y="280" font-family="Arial, sans-serif" font-size="14" fill="#8892b0" text-anchor="middle">→ Deploy</text>
  
  <!-- Arrow 2 -->
  <line x1="530" y1="250" x2="590" y2="250" stroke="#64ffda" stroke-width="3"/>
  <polygon points="590,250 580,245 580,255" fill="#64ffda"/>
  
  <!-- S3 Bucket -->
  <rect x="600" y="200" width="180" height="100" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="690" y="235" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ff6b35" text-anchor="middle">S3 Bucket</text>
  <text x="690" y="260" font-family="Arial, sans-serif" font-size="13" fill="#8892b0" text-anchor="middle">/pr-123/</text>
  <text x="690" y="280" font-family="Arial, sans-serif" font-size="13" fill="#8892b0" text-anchor="middle">/pr-124/</text>
  
  <!-- Arrow 3 -->
  <line x1="780" y1="250" x2="840" y2="250" stroke="#64ffda" stroke-width="3"/>
  <polygon points="840,250 830,245 830,255" fill="#64ffda"/>
  
  <!-- Preview URL -->
  <rect x="850" y="200" width="180" height="100" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="940" y="235" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#64ffda" text-anchor="middle">Preview</text>
  <text x="940" y="265" font-family="Arial, sans-serif" font-size="14" fill="#58a6ff" text-anchor="middle">Live URL</text>
  <text x="940" y="285" font-family="Arial, sans-serif" font-size="12" fill="#8892b0" text-anchor="middle">Posted to PR</text>
  
  <!-- Features -->
  <rect x="100" y="370" width="320" height="200" rx="8" fill="#1a1f3a" stroke="#30363d" stroke-width="2"/>
  <text x="260" y="405" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#64ffda" text-anchor="middle">Features</text>
  <text x="260" y="435" font-family="Arial, sans-serif" font-size="15" fill="#8892b0" text-anchor="middle">✓ Terraform IaC</text>
  <text x="260" y="460" font-family="Arial, sans-serif" font-size="15" fill="#8892b0" text-anchor="middle">✓ S3 Static Hosting</text>
  <text x="260" y="485" font-family="Arial, sans-serif" font-size="15" fill="#8892b0" text-anchor="middle">✓ 7-day Auto-cleanup</text>
  <text x="260" y="510" font-family="Arial, sans-serif" font-size="15" fill="#8892b0" text-anchor="middle">✓ Draft PR Exclusion</text>
  <text x="260" y="535" font-family="Arial, sans-serif" font-size="15" fill="#8892b0" text-anchor="middle">✓ ACL Hardening</text>
  
  <!-- Cost -->
  <rect x="450" y="370" width="320" height="200" rx="8" fill="#1a1f3a" stroke="#30363d" stroke-width="2"/>
  <text x="610" y="405" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ff6b35" text-anchor="middle">Cost</text>
  <text x="610" y="435" font-family="Arial, sans-serif" font-size="15" fill="#8892b0" text-anchor="middle">Storage: $0.01/mo</text>
  <text x="610" y="460" font-family="Arial, sans-serif" font-size="15" fill="#8892b0" text-anchor="middle">Requests: $0.25/mo</text>
  <text x="610" y="485" font-family="Arial, sans-serif" font-size="15" fill="#8892b0" text-anchor="middle">Transfer: $0</text>
  <text x="610" y="520" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#64ffda" text-anchor="middle">Total: $0.50/mo</text>
  <text x="610" y="545" font-family="Arial, sans-serif" font-size="13" fill="#58a6ff" text-anchor="middle">vs $20/mo Vercel</text>
  
  <!-- Benefits -->
  <rect x="800" y="370" width="320" height="200" rx="8" fill="#1a1f3a" stroke="#30363d" stroke-width="2"/>
  <text x="960" y="405" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#58a6ff" text-anchor="middle">Benefits</text>
  <text x="960" y="435" font-family="Arial, sans-serif" font-size="15" fill="#8892b0" text-anchor="middle">✓ Auto-deploy</text>
  <text x="960" y="460" font-family="Arial, sans-serif" font-size="15" fill="#8892b0" text-anchor="middle">✓ Test on devices</text>
  <text x="960" y="485" font-family="Arial, sans-serif" font-size="15" fill="#8892b0" text-anchor="middle">✓ Share easily</text>
  <text x="960" y="510" font-family="Arial, sans-serif" font-size="15" fill="#8892b0" text-anchor="middle">✓ No manual setup</text>
  <text x="960" y="535" font-family="Arial, sans-serif" font-size="15" fill="#8892b0" text-anchor="middle">✓ Instant feedback</text>
</svg>
