  <text x="840" y="318" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#c9d1d9">Injects datafile from server</text>
  <text x="840" y="352" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6e7681">autoUpdate off - no double poll</text>
